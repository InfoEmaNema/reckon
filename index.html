function saveDecision(fd){let vals=Object.fromEntries(fd.entries()),rawOptions=$$('#options input[name="option"]').map(x=>x.value.trim()),selected=fd.get('chosenIndex');if(selected===null){toast('Choose which option you picked.');return}let chosenIndex=Number(selected),chosen=rawOptions[chosenIndex],opts=rawOptions.filter(Boolean),date=vals.date||today(),days=Math.max(1,Math.min(3650,Number(period)||30)),rawProbability=Number(vals.expectedProbability),probability=vals.expectedProbability!==''&&Number.isFinite(rawProbability)?Math.max(0,Math.min(100,rawProbability)):70;if(opts.length<2){toast('Add at least two options.');return}if(!chosen){toast('Choose a non-empty option.');return}let savedChosenIndex=rawOptions.slice(0,chosenIndex).filter(Boolean).length,existing=state.decisions.find(d=>d.id===vals.id),data={id:vals.id||uid(),title:vals.title.trim(),description:vals.description,categoryId:vals.categoryId,date,options:opts,chosen,chosenIndex:savedChosenIndex,reasoning:vals.reasoning,expectedOutcome:vals.expectedOutcome.trim(),whatCouldGoWrong:vals.whatCouldGoWrong,expectedProbability:probability,moodAtDecision:selectedMood,reviewAfterDays:days,reviewDueDate:addDays(date,days),status:existing?.status||'pending',review:existing?.review||null,tags:vals.tags.split(',').map(x=>x.trim()).filter(Boolean)};if(existing)Object.assign(existing,data);else state.decisions.push(data);save();closeModal();render();toast(existing?'Decision updated':'Decision saved')}
function detail(d){let [cl,label]=statusOf(d);modalShell(d.title,`<div class="modalbody"><div class="cardtop">${categoryBadge(d.categoryId)}<span class="pill ${cl}">${label}</span><span class="muted">${pretty(d.date)}</span></div><p>${esc(d.description)}</p><div class="detail-context"><div class="eyebrow">You chose</div><b>${esc(d.chosen)}</b><p style="margin-top:12px"><span class="eyebrow">Expected outcome · ${d.expectedProbability}%</span><br>${esc(d.expectedOutcome)}</p><p><span class="eyebrow">Your reasoning</span><br>${esc(d.reasoning||'—')}</p>${d.whatCouldGoWrong?`<p><span class="eyebrow">Uncertainties</span><br>${esc(d.whatCouldGoWrong)}</p>`:''}<p class="muted">Options considered: ${d.options.map(esc).join(' · ')}</p><p class="muted">Review after ${d.reviewAfterDays} days · Due ${pretty(d.reviewDueDate)}</p><p><span class="eyebrow">Mood at decision</span><br>${esc(d.moodAtDecision||'Not recorded')}</p><p><span class="eyebrow">Tags</span><br>${d.tags.length?d.tags.map(t=>'#'+esc(t)).join(' '):'—'}</p></div>${d.review?`<div class="detail-context"><div class="eyebrow">Review · ${pretty(d.review.reviewDate)}</div><p><b>Prediction ${esc(d.review.predictionAccuracy)}</b> — ${esc(d.review.actualOutcome)}</p>${d.review.missed?`<p><span class="eyebrow">What I missed</span><br>${esc(d.review.missed)}</p>`:''}<p><span class="eyebrow">What I learned</span><br>${esc(d.review.whatILearned)}</p><p><span class="eyebrow">Mood at review</span><br>${esc(d.review.moodAtReview||'Not recorded')}</p>${d.review.notes?`<p><span class="eyebrow">Notes</span><br>${esc(d.review.notes)}</p>`:''}</div>`:''}<div class="detail-actions">${d.status==='pending'?`<button class="btn primary" data-action="review-now" data-id="${esc(d.id)}">Review now</button>`:''}<button class="btn" data-action="edit-decision" data-id="${esc(d.id)}">Edit</button><button class="btn" data-action="delete-decision" data-id="${esc(d.id)}">Delete</button></div></div><footer class="modalfoot"><button class="btn" data-close>Close</button></footer>`,true)}
function reviewForm(d){selectedMood=null;return `<form id="reviewForm"><div class="modalbody"><div class="detail-context">${categoryBadge(d.categoryId)}<div class="eyebrow" style="margin-top:10px">${pretty(d.date)} · You chose</div><b>${esc(d.title)} — ${esc(d.chosen)}</b><p style="margin-top:10px">${esc(d.expectedOutcome)}</p><span class="pill">Declared probability: ${d.expectedProbability}%</span></div><div class="formgroup"><label>What actually happened? *</label><textarea class="textarea" name="actualOutcome" required></textarea></div><div class="formgroup"><label>Did your prediction come true? *</label><div class="moods"><button type="button" class="mood" data-accuracy="right">Right</button><button type="button" class="mood" data-accuracy="wrong">Wrong</button><button type="button" class="mood" data-accuracy="partial">Partially</button></div><input type="hidden" name="predictionAccuracy" required></div><div class="formgroup"><label>What did you miss or underestimate?</label><textarea class="textarea" name="missed"></textarea></div><div class="formgroup"><label>What did you learn? *</label><textarea class="textarea" name="whatILearned" required></textarea></div><div class="formgroup"><label>How do you feel now?</label>${moodPicker(selectedMood)}</div><div class="formgroup"><label>Additional notes</label><textarea class="textarea" name="notes"></textarea></div><input type="hidden" name="id" value="${esc(d.id)}"></div><footer class="modalfoot"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save review</button></footer></form>`}
function openReview(d){
  modalShell('Review this decision',reviewForm(d),true);
  let f=$('#reviewForm');
  selectedMood=null;
  f.addEventListener('click',e=>{
    let b=e.target.closest('[data-mood],[data-accuracy]');
    if(!b)return;
    if(b.dataset.mood){selectedMood=b.dataset.mood;$$('[data-mood]',f).forEach(x=>x.classList.toggle('active',x===b))}
    if(b.dataset.accuracy){f.elements.predictionAccuracy.value=b.dataset.accuracy;$$('[data-accuracy]',f).forEach(x=>x.classList.toggle('active',x===b))}
  });
  f.addEventListener('submit',e=>{
    e.preventDefault();
    if(!f.elements.predictionAccuracy.value){toast('Choose whether your prediction was right, wrong, or partial.');return}
    if(!selectedMood){toast('Choose how you feel now.');return}
    let fd=new FormData(f),x=state.decisions.find(z=>z.id===fd.get('id'));
    // FIX: accuracy must be explicitly selected.
    x.review={reviewDate:today(),actualOutcome:fd.get('actualOutcome').trim(),predictionAccuracy:fd.get('predictionAccuracy'),whatILearned:fd.get('whatILearned').trim(),missed:fd.get('missed').trim(),moodAtReview:selectedMood,notes:fd.get('notes')};
    x.status='reviewed';save();closeModal();render();toast('Review saved');
  });
}
// Custom canvas charts, with colors taken from the active theme.
function drawCharts(){let c=$('#calChart');if(c)drawCalibration(c);let t=$('#timeChart');if(t)drawTimeline(t)}
function canvasSetup(c){let r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;let x=c.getContext('2d');x.scale(dpr,dpr);return[x,r.width,r.height]}
function drawCalibration(c){let [x,w,h]=canvasSetup(c),css=getComputedStyle(document.body),muted=css.getPropertyValue('--muted'),accent=css.getPropertyValue('--accent'),border=css.getPropertyValue('--border');let p={l:42,r:16,t:14,b:34},pw=w-p.l-p.r,ph=h-p.t-p.b;x.clearRect(0,0,w,h);x.font='11px Inter';x.fillStyle=muted;x.strokeStyle=border;for(let n=0;n<=100;n+=20){let yy=p.t+ph*(1-n/100),xx=p.l+pw*n/100;x.beginPath();x.moveTo(p.l,yy);x.lineTo(w-p.r,yy);x.stroke();x.fillText(n+'%',4,yy+4);x.fillText(n+'%',xx-10,h-9)}x.setLineDash([5,5]);x.strokeStyle=muted;x.beginPath();x.moveTo(p.l,p.t+ph);x.lineTo(p.l+pw,p.t);x.stroke();x.setLineDash([]);let rev=state.decisions.filter(d=>d.review);for(let i=0;i<5;i++){let a=i*20,b=a+20,r=rev.filter(d=>d.expectedProbability>=a&&(d.expectedProbability<b||(i===4&&d.expectedProbability===100)));if(!r.length)continue;let success=r.filter(d=>d.review.predictionAccuracy==='right').length/r.length,conf=r.reduce((s,d)=>s+d.expectedProbability,0)/r.length,xx=p.l+pw*conf/100,yy=p.t+ph*(1-success);x.fillStyle=accent;x.beginPath();x.arc(xx,yy,6,0,Math.PI*2);x.fill();x.fillStyle=muted;x.fillText(`${a}–${b}`,xx-14,yy-11)}}
function drawTimeline(c){let rev=state.decisions.filter(d=>d.review).sort((a,b)=>a.review.reviewDate.localeCompare(b.review.reviewDate));if(rev.length<2)return;let [x,w,h]=canvasSetup(c),css=getComputedStyle(document.body),muted=css.getPropertyValue('--muted'),accent=css.getPropertyValue('--accent'),border=css.getPropertyValue('--border'),p={l:42,r:16,t:14,b:34},pw=w-p.l-p.r,ph=h-p.t-p.b;x.clearRect(0,0,w,h);x.font='11px Inter';x.fillStyle=muted;x.strokeStyle=border;for(let n=0;n<=100;n+=20){let yy=p.t+ph*(1-n/100);x.beginPath();x.moveTo(p.l,yy);x.lineTo(w-p.r,yy);x.stroke();x.fillText(n+'%',4,yy+4)}let vals=rev.map((d,i)=>({d,i,v:rev.slice(Math.max(0,i-2),i+1).filter(q=>q.review.predictionAccuracy==='right').length/Math.min(i+1,3)}));x.strokeStyle=accent;x.lineWidth=2;x.beginPath();vals.forEach((q,i)=>{let xx=p.l+pw*(i/Math.max(1,vals.length-1)),yy=p.t+ph*(1-q.v);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();vals.forEach((q,i)=>{let xx=p.l+pw*(i/Math.max(1,vals.length-1)),yy=p.t+ph*(1-q.v);x.fillStyle=accent;x.beginPath();x.arc(xx,yy,4,0,7);x.fill()})}
// Exports and category edit forms
function download(name,data,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Export ready')}
function markdown(){return '# Reckon — Decision Journal\n\n'+[...state.decisions].sort((a,b)=>b.date.localeCompare(a.date)).map(d=>`## ${d.title}\n\n**Date:** ${d.date}  \n**Category:** ${cat(d.categoryId).name}  \n**Chosen:** ${d.chosen}  \n**Options:** ${d.options.join('; ')}  \n**Confidence:** ${d.expectedProbability}%  \n**Mood:** ${d.moodAtDecision}  \n**Tags:** ${d.tags.join(', ')||'—'}\n\n### Context\n${d.description||'—'}\n\n### Reasoning\n${d.reasoning||'—'}\n\n### Expected outcome\n${d.expectedOutcome}\n\n### What could go wrong\n${d.whatCouldGoWrong||'—'}\n\n${d.review?`### Review · ${d.review.reviewDate}\n**Prediction:** ${d.review.predictionAccuracy}\n\n**Actual outcome:** ${d.review.actualOutcome}\n\n**What I learned:** ${d.review.whatILearned}\n\n**What I missed:** ${d.review.missed||'—'}\n\n**Notes:** ${d.review.notes||'—'}\n`:''}`).join('\n---\n\n')}
function categoryEditor(c){modalShell(c?'Edit category':'Add category',`<form id="catForm"><div class="modalbody"><div class="formgroup"><label>Name</label><input class="field" name="name" required value="${esc(c?.name||'')}"></div><div class="formgrid"><div class="formgroup"><label>Emoji icon</label><input class="field" name="icon" maxlength="8" required value="${esc(c?.icon||'🌿')}"></div><div class="formgroup"><label>Color</label><input class="field" type="color" name="color" value="${esc(c?.color||'#7c5cff')}" style="height:44px;padding:4px"></div></div><input name="id" type="hidden" value="${esc(c?.id||'')}"></div><footer class="modalfoot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save category</button></footer></form>`);$('#catForm').addEventListener('submit',e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.currentTarget)),old=state.categories.find(x=>x.id===v.id);if(old)Object.assign(old,{name:v.name,icon:v.icon,color:v.color});else state.categories.push({id:uid(),name:v.name,icon:v.icon,color:v.color});save();closeModal();render();toast('Category saved')})}
// One delegated document listener owns all data-action controls.
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id,d=state.decisions.find(x=>x.id===id);if(a==='tab'){tab=b.dataset.tab;render()}if(a==='new-decision')openDecisionForm();if(a==='open-decision'&&d)detail(d);if(a==='review-now'&&d)openReview(d);if(a==='edit-decision'&&d)openDecisionForm(d);if(a==='delete-decision'&&d&&confirm(`Delete “${d.title}”? This cannot be undone.`)){state.decisions=state.decisions.filter(x=>x.id!==id);save();closeModal();render();toast('Decision deleted')}if(a==='jump-to-reviews'){tab='reviews';render()}if(a==='theme'){state.settings.theme=state.settings.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.settings.theme;save();render()}if(a==='export-json')download('reckon-backup.json',JSON.stringify(state,null,2),'application/json');if(a==='export-markdown')download('reckon-decisions.md',markdown(),'text/markdown');if(a==='reset'&&confirm('Reset all decisions and settings?')&&confirm('Are you sure? This permanently removes your journal data.')){state=normalizeState({version:1,decisions:sample(),categories:defaultCategories,settings:DEFAULT_SETTINGS});document.documentElement.dataset.theme=state.settings.theme;save();render();toast('Journal reset')}if(a==='add-category')categoryEditor();if(a==='edit-category')categoryEditor(state.categories.find(x=>x.id===id));if(a==='remove-category'){let c=state.categories.find(x=>x.id===id);if(c&&confirm(`Remove ${c.name}? Decisions in this category will remain in your journal.`)){state.categories=state.categories.filter(x=>x.id!==id);state.decisions.forEach(q=>{if(q.categoryId===id)q.categoryId='personal'});save();render();toast('Category removed')}}});
// Search preserves cursor; filters and imports are saved as soon as changed.
$('#view').addEventListener('input',e=>{if(e.target.matches('[data-search]')){let el=e.target,pos=el.selectionStart;filters.search=el.value;let v=$('#view');let html=journal();v.innerHTML=html;let n=$('[data-search]');n.focus();n.setSelectionRange(pos,pos)}});$('#view').addEventListener('change',e=>{if(e.target.matches('[data-filter-cat]')){filters.cat=e.target.value;render()}if(e.target.matches('[data-filter-status]')){filters.status=e.target.value;render()}if(e.target.matches('[data-setting-days]')){state.settings.defaultReviewDays=Number(e.target.value);save()}if(e.target.id==='importFile'&&e.target.files[0]){let f=e.target.files[0],rd=new FileReader();rd.onload=()=>{try{let n=JSON.parse(rd.result);// FIX: reject malformed exports and discard invalid decision rows
if(n.version!==1||!Array.isArray(n.decisions)||!Array.isArray(n.categories)||!n.categories.every(c=>c&&typeof c.id==='string'&&typeof c.name==='string'&&typeof c.color==='string'&&typeof c.icon==='string'))throw Error();let settings=n.settings&&typeof n.settings==='object'?n.settings:{},valid=d=>d&&typeof d.id==='string'&&typeof d.title==='string'&&isValidISODate(d.date)&&isValidISODate(d.reviewDueDate)&&['pending','reviewed','skipped'].includes(d.status)&&typeof d.expectedProbability==='number'&&Number.isFinite(d.expectedProbability)&&d.expectedProbability>=0&&d.expectedProbability<=100,invalid=n.decisions.filter(d=>!valid(d)).length;n.decisions=n.decisions.filter(valid);if(confirm('Replace your current journal with this imported data?')){state=normalizeState({...n,settings:normalizeSettings(settings)});filters={cat:'all',status:'all',search:''};document.documentElement.dataset.theme=state.settings.theme;save();render();toast(invalid?`Import complete · ${invalid} invalid decisions discarded`:'Import complete')}}catch(_){toast('That file is not a valid Reckon export.')}};rd.readAsText(f)}});
document.documentElement.dataset.theme=state.settings.theme||'dark';window.addEventListener('resize',()=>{if(tab==='insights')drawCharts()});setTimeout(()=>render(),400);
// Best-effort service worker registration; file:// remains fully usable without it.
if(location.protocol!=='file:'&&'serviceWorker'in navigator){try{let blob=new Blob([`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});`],{type:'text/javascript'});navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{})}catch(e){}}
})();
